schema_version = "1.1"

[task]
name = "syscraft/cassandra-nic-split-brain"
description = "Diagnose and repair a Cassandra split-brain caused by physical NIC loss on a cluster node"
keywords = ["cassandra", "split-brain", "nic", "bare-metal", "storage"]

[metadata]
difficulty = "hard"
tags = ["cassandra", "split-brain", "nic", "bare-metal", "l2", "storage"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
type = "cloudlab"
build_timeout_sec = 1800.0

[[environment.nodes]]
name = "node0"
host = "node0.example.invalid"
roles = ["primary"]

[[environment.nodes]]
name = "node1"
host = "node1.example.invalid"

[[environment.nodes]]
name = "node2"
host = "node2.example.invalid"
